name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: android-actions/setup-android@v4

      - run: flutter pub get
      - run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cuan-party-apk
          path: build/app/outputs/flutter-apk/app-release.apk
