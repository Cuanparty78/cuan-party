name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-cuan-party-${{ hashFiles('**/pubspec.lock', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-cuan-party-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v4

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: |
          for attempt in 1 2 3; do
            echo "=== flutter pub get attempt $attempt/3 ==="

            if flutter pub get; then
              echo "flutter pub get succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "pub get failed. Waiting 20 seconds..."
              sleep 20
            fi
          done

          echo "flutter pub get failed after 3 attempts."
          exit 1

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/cuanparty-release.jks
          test -s android/app/cuanparty-release.jks
          ls -lh android/app/cuanparty-release.jks

      - name: Check ZEGO configuration
        env:
          ZEGO_APP_ID: ${{ secrets.ZEGO_APP_ID }}
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          set -e

          CLEAN_ID="$(printf '%s' "$ZEGO_APP_ID" | tr -d '[:space:]')"
          CLEAN_SIGN="$(printf '%s' "$ZEGO_APP_SIGN" | tr -d '[:space:]')"

          if [ -z "$CLEAN_ID" ]; then
            echo "ERROR: ZEGO_APP_ID secret kosong."
            exit 1
          fi

          if ! [[ "$CLEAN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: ZEGO_APP_ID bukan angka."
            exit 1
          fi

          if ! [[ "$CLEAN_SIGN" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: ZEGO_APP_SIGN wajib AppSign 64 karakter hex dari console, bukan temporary token."
            exit 1
          fi
          if [ "$CLEAN_ID" != "46360202" ]; then
            echo "ERROR: ZEGO_APP_ID tidak cocok dengan proyek CUAN_PARTY yang digunakan untuk tes iPhone."
            exit 1
          fi
          # Normalize the values actually passed to Flutter as well as checking
          # them. Never print the AppSign in build logs.
          echo "ZEGO_APP_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          echo "ZEGO_APP_SIGN=$CLEAN_SIGN" >> "$GITHUB_ENV"

          echo "ZEGO_APP_ID OK."
          echo "ZEGO_APP_SIGN OK."
          echo "ZEGO CONFIG PASSED."

      - name: Build release APK
        env:
          KEYSTORE_FILE: app/cuanparty-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dhttp.connectionTimeout=120000
            -Dhttp.socketTimeout=120000
            -Dhttps.connectionTimeout=120000
            -Dhttps.socketTimeout=120000

        run: |
          for attempt in 1 2 3; do
            echo "======================================"
            echo "=== APK BUILD ATTEMPT $attempt/3 ==="
            echo "======================================"

            if flutter build apk --release \
              --dart-define=ZEGO_APP_ID="$ZEGO_APP_ID" \
              --dart-define=ZEGO_APP_SIGN="$ZEGO_APP_SIGN"; then
              echo "APK BUILD SUCCEEDED."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed."
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

          echo "APK BUILD FAILED AFTER 3 ATTEMPTS."
          exit 1

      - name: Verify ZEGO native methods in release APK
        run: python3 scripts/verify_zego_apk.py build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cuan-party-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
